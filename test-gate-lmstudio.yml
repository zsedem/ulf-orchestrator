# Ulf Orchestrator Configuration - Completion Gates E2E Test
# Target: LMStudio at 192.168.2.1:1234 via opencode
#
# Setup:
# 1. Ensure opencode is installed and configured for LMStudio:
#    opencode config set base_url http://192.168.2.1:1234/v1
#    opencode config set api_key lm-studio
# 2. Run: ulf run -c test-gate-lmstudio.yml -p "Create .ulf/completion-marker and remove any TODO from README.md"

event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 5
  completion_gates:
    - name: file-exists
      command: ["test", "-f", ".ulf/completion-marker"]
    - name: no-todo
      command: ["sh", "-c", "! grep -q 'TODO' README.md"]

cli:
  backend: "custom"
  command: "opencode"
  args:
    - "run"
    - "-m"
    - "anthropic/claude-sonnet-4-20250514"
  prompt_mode: "arg"

core:
  guardrails:
    - "You must satisfy ALL completion gates before emitting LOOP_COMPLETE"
    - "If a gate fails, you will receive its output and get another iteration to fix the issue"
